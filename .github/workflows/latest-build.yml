# Latest build: publishes the release APKs of a branch as the GitHub release <branch>-latest,
# so the README can link a fresh build that anyone can download and install.
#
#   CI passes on a push to main, kmp-ready or kmp → build the release APKs → replace the release
#
# It can also be started by hand from the Actions tab ("Run workflow").

name: Latest build


# ============================================================================
# When it runs
# ============================================================================

on:
  # After every finished run of the CI workflow on these branches; the job below keeps only the passed pushes.
  # GitHub runs this trigger only from the copy of this file on main, so a change to it can't be tried in a PR.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, kmp-ready, kmp]
  # The "Run workflow" button in the Actions tab.
  workflow_dispatch:

# A newer build of the same branch cancels one still going: only the newest commit matters.
concurrency:
  group: latest-build-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

# Unlike CI, this workflow writes to the repo: it creates and deletes releases and their tags.
permissions:
  contents: write


jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # A normal run takes about 6 minutes.
    timeout-minutes: 30
    # Only builds that passed CI, and only from pushes: CI also runs for pull requests, whose code must never
    # get this job's write access. By hand it always runs.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # Which branch and commit to build: after CI, the ones its run checked; by hand, where the workflow was started.
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:

      # --- Setup: the code, Java and Gradle ---------------------------------

      # The commit CI checked, even if the branch has moved on since.
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The same caching as in CI (ci.yml explains it).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # --- Build and publish ------------------------------------------------

      # Release builds: R8 shrinks the code, the APKs are signed with the debug key from the repo.
      - name: Build release APKs
        run: ./gradlew :apps:shop:assembleRelease :apps:uikit:assembleRelease

      # gh is GitHub's command-line tool, preinstalled on the runner; it acts with this job's token.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fixed file names keep the download links in the README the same from build to build.
          mkdir dist
          cp apps/shop/build/outputs/apk/release/shop-release.apk dist/ShoppingApp.apk
          cp apps/uikit/build/outputs/apk/release/uikit-release.apk dist/ShoppingApp-UiKit.apk
          TAG="$BRANCH-latest"

          # The main build is the repo's Latest release, shown on its front page; the other branches are pre-releases.
          if [ "$BRANCH" = main ]; then KIND="--latest"; else KIND="--prerelease --latest=false"; fi

          # The old release and its tag go first, so the tag moves to the new commit. The first time there is none.
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" dist/*.apk \
            --target "$SHA" \
            $KIND \
            --title "$BRANCH — latest build" \
            --notes "Release build of \`$BRANCH\` at ${SHA:0:7}, signed with the debug key from the repo."
