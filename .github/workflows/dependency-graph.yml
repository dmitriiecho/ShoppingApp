# Dependency graph: sends GitHub the list of libraries the app and the server ship with, transitive ones included.
#
#   push to main → Gradle resolves the libraries → GitHub's Dependency graph (Insights tab)
#
# GitHub checks the list against its database of known vulnerabilities and, if a library has one, shows a
# Dependabot alert in the Security tab. Without this workflow GitHub can't read the Gradle build and sees nothing.

name: Dependency graph


# ============================================================================
# When it runs
# ============================================================================

on:
  # The same changes as CI: a change only to docs can't change the libraries.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/readme/**'
  # The "Run workflow" button in the Actions tab.
  workflow_dispatch:

# Sending the list to GitHub needs write access. It is kept in this separate workflow, which runs only on main,
# so CI stays read-only.
permissions:
  contents: write


jobs:

  # ==========================================================================
  # Android: the libraries in the release APKs
  # ==========================================================================

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Sets up Gradle like setup-gradle in CI, resolves the libraries and sends the list.
      # Only what ships: release runtime classpaths of the Android modules, runtime ones of the pure Kotlin modules.
      # Build tools (lint, KSP, Gradle plugins) and debug-only libraries are left out: they never reach a user.
      - name: Send the libraries to GitHub
        uses: gradle/actions/dependency-submission@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          dependency-graph-include-configurations: '(release)?[Rr]untimeClasspath'

  # ==========================================================================
  # Server: the libraries the Ktor backend runs with
  # ==========================================================================

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The server is a separate Gradle build in server/.
      - name: Send the libraries to GitHub
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: server
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          dependency-graph-include-configurations: 'runtimeClasspath'
