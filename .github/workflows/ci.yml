# Checks every pull request and every push to main: code style, lint and the build of both apps,
# plus the server's code style and tests. The server is a separate Gradle build, so it gets its own job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its run that is still going; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and its dependencies between runs; also validates gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v6

      - name: Code style
        run: ./gradlew spotlessCheck

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build
        run: ./gradlew :apps:shop:assembleDebug :apps:uikit:assembleDebug

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Code style and tests
        run: ./gradlew spotlessCheck test
