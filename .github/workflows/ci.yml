# CI: checks every pull request and every push to main and the variant branches (kmp-ready, kmp).
#
#   Android job: code style → module rules → unused dependencies → lint → unit tests → both apps build
#   iOS job:     shared code tests on the iOS simulator → the iOS app builds
#   Server job:  code style → tests
#
# The jobs run in parallel, each on its own fresh virtual machine (a "runner").
# The server is a separate Gradle build (server/), so it gets a job of its own.
# Latest build (latest-build.yml) starts after this workflow passes on a push.
# Screenshot comment (screenshot-comment.yml) starts after it on a pull request.

name: CI


# ============================================================================
# When it runs
# ============================================================================

on:
  pull_request:
    # A change only to docs, READMEs or their images builds nothing, so it doesn't start a run.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/readme/**'
  push:
    # Latest build publishes the APKs of these branches after CI passes on them.
    branches: [main, kmp-ready, kmp]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/readme/**'

# Runs in the same group don't overlap. A new push to a pull request cancels its run that is still going;
# runs on pushes to the branches always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token every job gets may only read the repo: the checks change nothing.
permissions:
  contents: read

# The caches are saved only on pushes to the branches where work goes on: main and kmp. Pull requests and the
# other branches only read them (a pull request reads its base branch's). GitHub keeps 10 GB of caches per repo
# and drops the oldest beyond that; a pull request's own copy would serve only that pull request.
env:
  CACHE_READ_ONLY: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/kmp') }}


jobs:

  # ==========================================================================
  # Android: the app and every module
  # ==========================================================================

  android:
    name: Android
    runs-on: ubuntu-latest
    # A normal run takes 2 to 8 minutes, depending on how much the build cache holds; the tests, screenshots
    # included, take up to 2 minutes of it. A hung one would otherwise hold the runner for GitHub's default 6 hours.
    timeout-minutes: 30
    # Gradle reads ORG_GRADLE_PROJECT_<name> as the property <name>: here -PwarningsAsErrors=true.
    # With it, Kotlin and lint warnings fail the build, so they don't pile up (build-logic, WarningsAsErrors.kt).
    env:
      ORG_GRADLE_PROJECT_warningsAsErrors: true

    steps:

      # --- Setup: the code, Java and Gradle ---------------------------------

      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle, the downloaded libraries and the build outputs between runs, and checks that
      # gradle-wrapper.jar is genuine.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.CACHE_READ_ONLY }}

      # Robolectric downloads the Android it runs tests on (about 200 MB) into ~/.m2, outside Gradle's cache.
      # Which Android it is depends on the Robolectric version and the targetSdk, so the key is made of those two:
      # a hash of whole files would make a new 350 MB copy on every change of an unrelated library.
      - name: Robolectric version and targetSdk
        id: robolectric-key
        run: >-
          echo "key=robolectric-$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)-sdk$(sed -n 's/.*TARGET_SDK = \([0-9]*\).*/\1/p' build-logic/src/main/kotlin/AndroidConfig.kt)"
          >> "$GITHUB_OUTPUT"

      - name: Restore Robolectric's Android
        id: robolectric
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-key.outputs.key }}

      # --- Checks -----------------------------------------------------------
      # By default a failed step skips all the steps after it. `if: !cancelled()` runs a check anyway
      # (unless the whole run was cancelled), so one run shows every problem at once.

      - name: Code style (ktlint)
        run: ./gradlew spotlessCheck

      # The allowed dependencies between modules are in build-logic/src/main/kotlin/ModuleGraphRules.kt.
      - name: Dependencies between modules (assertModuleGraph)
        if: ${{ !cancelled() }}
        run: ./gradlew assertModuleGraph

      # Unused dependencies and module structure; the rules are in the root build.gradle.kts.
      - name: Unused dependencies (buildHealth)
        if: ${{ !cancelled() }}
        run: ./gradlew buildHealth

      # Android's own rules plus Slack's Compose rules; exceptions are in the root lint.xml.
      # lintDebug: the Android modules; lintAndroidMain: the KMP modules, their common code included.
      - name: Problems in code and resources (Android lint)
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug lintAndroidMain

      # Every module's tests, on debug: logic, ViewModels, the database (Robolectric), the API samples, and the
      # screenshots of every @Preview compared with the saved images.
      # test: the Android modules; testAndroidHostTest: the KMP modules, which have no test task, on the JVM.
      # --continue: a failed module doesn't stop the others, so the report shows every failing test.
      # The rules for tests are in docs/architecture/en/testing.md.
      - name: Behaviour (unit tests)
        id: tests
        if: ${{ !cancelled() }}
        run: ./gradlew test testAndroidHostTest --continue

      # After the tests, which download it on a miss; also when one failed, the download is the same.
      - name: Save Robolectric's Android
        if: ${{ !cancelled() && env.CACHE_READ_ONLY == 'false' && steps.robolectric.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-key.outputs.key }}

      # Shows each failed test, with its message and line, at the top of the run's page and, when the test file
      # is among the PR's changes, next to the test's line in Files changed; below, a summary with each failure's
      # full stack trace.
      # annotate_only: no check run of its own, which would need a token that can write.
      - name: Failed tests
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/**/*.xml'
          check_name: Android tests
          annotate_only: true
          detailed_summary: true
          failed_summary_logs: true

      # A changed screenshot can't be shown in the summary: its saved image, the new one and the difference,
      # side by side, are attached to the run for a week. Screenshot comment (screenshot-comment.yml) shows them
      # in a comment on the pull request.
      - name: Changed screenshots
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: changed-screenshots
          path: '**/build/outputs/roborazzi/*_compare.png'
          if-no-files-found: ignore
          retention-days: 7

      - name: Both apps compile (assembleDebug)
        if: ${{ !cancelled() }}
        run: ./gradlew :apps:shop:assembleDebug :apps:uikit:assembleDebug

  # ==========================================================================
  # iOS: the shared code on the iOS simulator and the iOS app (apps/shop/ios)
  # ==========================================================================

  # iOS builds only on macOS. The repository is public, so GitHub's macOS runners are free.
  ios:
    name: iOS
    runs-on: macos-latest
    # Kotlin/Native and the Xcode build take about 15 minutes on an empty cache.
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The same caching as in the Android job; on Linux and macOS the caches are separate.
      # No cleanup before saving: it drops the cached test executables of iOS, although the run took them from
      # the cache, and every next run links them again. Gradle itself removes the entries unused for 7 days.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.CACHE_READ_ONLY }}
          cache-cleanup: never

      # The Kotlin/Native compiler and its dependencies (~1 GB), downloaded once per Kotlin version. When it links,
      # it also builds caches of the libraries (Compose, coroutines…) into ~/.konan, a few minutes of work. So the
      # key is the Kotlin version plus the version catalog: a new set of libraries saves a new copy, which starts
      # from the latest one of that Kotlin version.
      - name: Kotlin version
        id: konan-key
        run: echo "kotlin=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Restore Kotlin/Native
        id: konan
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.konan-key.outputs.kotlin }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ steps.konan-key.outputs.kotlin }}-

      # The common tests of every KMP module (src/commonTest), compiled for iOS and run on the simulator.
      - name: Shared code on iOS (simulator tests)
        id: tests
        run: ./gradlew iosSimulatorArm64Test --continue

      - name: Failed tests
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/**/*.xml'
          check_name: iOS tests
          annotate_only: true
          detailed_summary: true
          failed_summary_logs: true

      # The Xcode project builds the Kotlin framework itself (its Run Script calls Gradle) and links it.
      # No signing: the simulator doesn't need it.
      - name: The iOS app builds (xcodebuild)
        if: ${{ !cancelled() }}
        working-directory: apps/shop/ios
        run: >-
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build

      # Last: the Xcode build links the framework and adds the caches of its libraries to ~/.konan.
      - name: Save Kotlin/Native
        if: ${{ !cancelled() && env.CACHE_READ_ONLY == 'false' && steps.konan.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

  # ==========================================================================
  # Server: the Ktor backend in server/
  # ==========================================================================

  server:
    name: Server
    runs-on: ubuntu-latest
    # A normal run takes under a minute.
    timeout-minutes: 15
    # Warnings fail the build here too (server/build.gradle.kts).
    env:
      ORG_GRADLE_PROJECT_warningsAsErrors: true
    # Every `run:` command of this job starts in server/, where its own Gradle wrapper is.
    defaults:
      run:
        working-directory: server

    steps:

      # --- Setup: the code, Java and Gradle ---------------------------------

      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The same caching as in the Android job.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.CACHE_READ_ONLY }}

      # --- Checks: each runs even if the one before failed ------------------

      - name: Code style (ktlint)
        run: ./gradlew spotlessCheck

      # Includes the check of the data files server/data/*.json and of the API samples in server/api-samples.
      - name: API and data files (tests)
        id: tests
        if: ${{ !cancelled() }}
        run: ./gradlew test

      # As in the Android job.
      - name: Failed tests
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'server/build/test-results/test/*.xml'
          check_name: Server tests
          annotate_only: true
          detailed_summary: true
          failed_summary_logs: true
