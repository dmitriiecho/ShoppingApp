# Memory for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Builds independent modules in parallel.
org.gradle.parallel=true
# Skips the configuration phase when no build script changed.
org.gradle.configuration-cache=true
# Parallel project sync in Android Studio.
org.gradle.tooling.parallel=true
kotlin.code.style=official
# KSP still adds generated sources through kotlin.sourceSets; AGP 9 built-in Kotlin rejects that by default.
android.disallowKotlinSourceSets=false
