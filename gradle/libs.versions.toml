[versions]
# Build
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
spotless = "8.10.4"
ktlint = "1.8.0"
moduleGraphAssert = "2.9.1"
dependencyAnalysis = "3.19.2"

# AndroidX
androidxCore = "1.19.1"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
paging = "3.5.2"
datastore = "1.2.1"
# The SQLite library Room uses (androidx.sqlite); the bundled driver must be the same version.
sqlite = "2.6.2"
composeBom = "2026.09.00"
composeLints = "1.6.1"

# Compose Multiplatform. On Android its libraries are the Jetpack ones of the same versions as the BOM's.
composeMultiplatform = "1.12.1"
# The latest stable one: on Android it is Jetpack Material3 1.4.0, as in the BOM.
composeMultiplatformMaterial3 = "1.9.0"
# JetBrains' builds of AndroidX Lifecycle for KMP; on Android they are Jetpack Lifecycle of the same version.
jetbrainsLifecycle = "2.11.0"
# JetBrains' build of Navigation Compose for KMP. On Android it is Jetpack's navigation-compose 2.10.0, raised to
# "navigation" above by the app's own dependency.
jetbrainsNavigation = "2.10.0-rc01"

# DI
metro = "1.4.5"

# Network and images
ktor = "3.6.0"
coil = "3.6.3"

# Kotlinx
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
kotlinxCollectionsImmutable = "0.5.2"

# Logging
kermit = "2.2.0"

# Testing
assertk = "0.28.1"
turbine = "1.2.1"
robolectric = "4.17"
androidxTestCore = "1.7.0"
roborazzi = "1.76.0"
composablePreviewScanner = "0.9.3"
junit = "4.13.2"

[libraries]
# AndroidX
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
# Only as a version limit (build-logic, AndroidConfig.kt): its classes are in core now.
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
# Room's driver with its own SQLite, the same on Android and iOS (DataModule in :crossfeature:data).
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }

# Network and images
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
coil = { group = "io.coil-kt.coil3", name = "coil", version.ref = "coil" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }

# Kotlinx
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }

# Logging
kermit = { group = "co.touchlab", name = "kermit", version.ref = "kermit" }

# The API formats shared with the server: the included build in contract/, so no version.
shoppingapp-contract = { group = "krio.systemdesign.shoppingapp", name = "contract" }

# Compose Multiplatform
jetbrains-compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
jetbrains-compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
jetbrains-compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
jetbrains-compose-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "composeMultiplatform" }
jetbrains-compose-ui-tooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "composeMultiplatform" }
jetbrains-compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMultiplatformMaterial3" }
jetbrains-compose-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
jetbrains-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "jetbrainsNavigation" }

# Testing
# kotlin.test for common tests (commonTest): Kotlin adds the test runner of each platform.
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
# kotlin.test annotations on the JUnit4 runner: Robolectric runs only on JUnit4.
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
assertk = { group = "com.willowtreeapps.assertk", name = "assertk", version.ref = "assertk" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
# Android classes on the JVM, for code that can't run without them (Room).
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
# Screenshot tests generated from the @Preview functions (shoppingapp.android.screenshots).
# The generated tests are plain JUnit4, and Roborazzi checks that junit:junit is declared.
junit = { group = "junit", name = "junit", version.ref = "junit" }
roborazzi-compose-preview-scanner-support = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose-preview-scanner-support", version.ref = "roborazzi" }
composable-preview-scanner = { group = "io.github.sergio-sastre.ComposablePreviewScanner", name = "android", version.ref = "composablePreviewScanner" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }

# Added to modules by the build-logic convention plugins. The IDE doesn't look there
# and marks these as unused, but they are used: don't delete them.
# Compose versions come from the BOM.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Slack's lint rules for Compose: modifier parameters, private previews, remember and the like.
compose-lint-checks = { group = "com.slack.lint.compose", name = "compose-lint-checks", version.ref = "composeLints" }

# For build-logic: AGP and Kotlin types the convention plugins use to configure the android and kotlin blocks
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
# For build-logic: the types of Metro's settings (MetroConventionPlugin)
metro-gradlePlugin = { group = "dev.zacsweers.metro", name = "gradle-plugin", version.ref = "metro" }
# For build-logic: the types of the screenshot tests' settings
roborazzi-gradlePlugin = { group = "io.github.takahirom.roborazzi", name = "roborazzi-gradle-plugin", version.ref = "roborazzi" }
# For build-logic: the types of the Compose Multiplatform settings (KmpComposeConventionPlugin)
compose-multiplatform-gradlePlugin = { group = "org.jetbrains.compose", name = "compose-gradle-plugin", version.ref = "composeMultiplatform" }
# For build-logic: the types for the module rules (ModuleGraphRules.kt)
module-graph-assertion-gradlePlugin = { group = "com.jraska.module.graph.assertion", name = "plugin", version.ref = "moduleGraphAssert" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
room = { id = "androidx.room", version.ref = "room" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
module-graph-assertion = { id = "com.jraska.module.graph.assertion", version.ref = "moduleGraphAssert" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

# Project convention plugins from build-logic
shoppingapp-android-application = { id = "shoppingapp.android.application" }
shoppingapp-android-library = { id = "shoppingapp.android.library" }
shoppingapp-android-compose = { id = "shoppingapp.android.compose" }
shoppingapp-metro = { id = "shoppingapp.metro" }
shoppingapp-android-feature = { id = "shoppingapp.android.feature" }
shoppingapp-android-screenshots = { id = "shoppingapp.android.screenshots" }
shoppingapp-kmp-library = { id = "shoppingapp.kmp.library" }
shoppingapp-kmp-compose = { id = "shoppingapp.kmp.compose" }
shoppingapp-kmp-feature = { id = "shoppingapp.kmp.feature" }
